name: Contraline
description: 'Contraline is a clinical-stage biotechnology company developing non-hormonal,
  long-acting, reversible contraceptive options for men and couples. Its lead product, ADAM,
  is an investigational implant designed to provide long-lasting reversible contraception,
  and NES/T is a daily topical gel intended to pause sperm production. Backed by GV (Google
  Ventures), Contraline runs clinical trials and participant programs from its Charlottesville,
  Virginia base. Its products are investigational and have not been approved by the FDA. The
  company operates a marketing and clinical-trial website with no public developer program or
  API; this API Evangelist profile captures its web presence, privacy posture, and domain
  security for the network catalog.'
